name: CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install shared package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/shared
          pip install pytest pytest-cov httpx fastapi apscheduler

      - name: Lint (compile check)
        run: |
          python -m compileall -q packages/shared services/api/app \
            services/afdd-engine/app services/edge-simulator graph

      - name: Unit tests with coverage
        run: |
          python -m pytest \
            packages/shared/tests \
            services/edge-simulator/tests \
            services/api/tests \
            services/afdd-engine/tests \
            --cov=afdd_shared --cov-report=term-missing -p no:cacheprovider

  build-images:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images
        run: |
          docker build -f services/api/Dockerfile -t afdd/api .
          docker build -f services/afdd-engine/Dockerfile -t afdd/engine .
          docker build -f services/edge-simulator/Dockerfile -t afdd/simulator .
          docker build -f services/dashboard/Dockerfile -t afdd/dashboard .
          docker build -f deploy/loader/Dockerfile -t afdd/loader .
