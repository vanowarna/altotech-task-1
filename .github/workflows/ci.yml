name: CI

on:
  push:
    branches: [ main, develop, "feat/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (compile check)
        run: |
          python -m compileall -q packages/shared services/api/app \
            services/afdd-engine/app services/edge-simulator graph

      # Each service has its own top-level `app` package, so suites MUST run in
      # separate processes to avoid sys.modules name collisions. (See scripts/run_tests.sh.)
      - name: Shared library tests (with coverage)
        run: python -m pytest packages/shared/tests --cov=afdd_shared --cov-report=term-missing -p no:cacheprovider

      - name: Edge simulator tests
        working-directory: services/edge-simulator
        run: python -m pytest tests -p no:cacheprovider

      - name: API tests
        working-directory: services/api
        run: python -m pytest tests -p no:cacheprovider

      - name: AFDD engine tests
        working-directory: services/afdd-engine
        run: python -m pytest tests -p no:cacheprovider

  build-images:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images
        run: |
          docker build -f services/api/Dockerfile -t afdd/api .
          docker build -f services/afdd-engine/Dockerfile -t afdd/engine .
          docker build -f services/edge-simulator/Dockerfile -t afdd/simulator .
          docker build -f services/dashboard/Dockerfile -t afdd/dashboard .
          docker build -f deploy/loader/Dockerfile -t afdd/loader .
