<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AltoTech AFDD · Fault Console</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root{--bg:#0e1014;--panel:#161922;--panel2:#1d212b;--text:#e6e8ec;--muted:#9aa1ad;
      --border:#262b35;--accent:#6366f1;--crit:#ef4444;--warn:#f59e0b;--minor:#3b82f6;--info:#9aa1ad;--ok:#22c55e;}
    [data-theme="light"]{--bg:#eef1f5;--panel:#ffffff;--panel2:#f5f7fa;--text:#15181e;--muted:#6b7280;--border:#e3e6eb;--accent:#4f46e5;}
    *{box-sizing:border-box}html,body{height:100%;margin:0}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
    #app{display:flex;flex-direction:column;height:100vh;padding:12px;gap:12px}
    .row{display:flex;align-items:center;gap:12px}
    header .brand{font-weight:700;font-size:15px}header .brand .mut{color:var(--muted);font-weight:500}
    .spacer{flex:1}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--ok)}
    button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 11px;transition:.15s}
    button:hover{border-color:var(--accent)}.status{font-size:12.5px;color:var(--muted)}
    .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
    .kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:11px 14px}
    .kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
    .kpi .v{font-size:22px;font-weight:700;margin-top:3px;line-height:1.1}
    .main{flex:1;display:grid;grid-template-columns:1.6fr 1fr;gap:12px;min-height:0}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;min-height:0}
    .card h3{margin:0;padding:11px 14px;font-size:13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
    .card h3 .spacer{flex:1}
    .viz{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:0 0 14px 14px}
    #scene{width:100%;height:100%;display:block;cursor:grab}#scene:active{cursor:grabbing}
    .legend{position:absolute;left:12px;bottom:12px;display:flex;gap:12px;flex-wrap:wrap;
      background:color-mix(in srgb,var(--panel) 80%,transparent);backdrop-filter:blur(7px);padding:7px 11px;border-radius:10px;font-size:11.5px;border:1px solid var(--border)}
    .legend span{display:inline-flex;align-items:center;gap:5px;color:var(--text)}
    .legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
    .viz-tools{position:absolute;right:12px;top:12px;display:flex;gap:6px}
    .viz-tools button{padding:5px 10px;font-size:12px;background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(7px)}
    .hint{position:absolute;left:12px;top:12px;font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--panel) 70%,transparent);padding:4px 9px;border-radius:8px}
    #tip{position:absolute;pointer-events:none;z-index:5;display:none;font-size:12px;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:230px}
    #tip .t{font-weight:600;margin-bottom:2px}#tip .s{color:var(--muted);font-size:11.5px}
    #tip .pill{display:inline-block;margin-top:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
    .right{display:flex;flex-direction:column;gap:12px;min-height:0}
    .charts{flex:0 0 auto}.charts .body{display:flex;gap:12px;padding:10px 14px;align-items:center}
    .chartbox{width:118px;height:118px;flex:0 0 auto}
    .sevlist{flex:1;display:flex;flex-direction:column;gap:6px}
    .sevrow{display:flex;align-items:center;gap:8px;font-size:12.5px}
    .sevrow .bar{flex:1;height:7px;border-radius:5px;background:var(--panel2);overflow:hidden}
    .sevrow .bar>i{display:block;height:100%}
    .sevrow .n{width:26px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
    .log{flex:1;min-height:0}.logbody{flex:1;overflow-y:auto;padding:6px 8px;min-height:0}
    .logbody::-webkit-scrollbar{width:8px}.logbody::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
    .item{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;padding:8px;border-radius:10px}
    .item:hover{background:var(--panel2)}.item+.item{border-top:1px solid var(--border)}
    .badge{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
    .b-critical{background:rgba(239,68,68,.16);color:var(--crit)}.b-warning{background:rgba(245,158,11,.18);color:var(--warn)}
    .b-minor{background:rgba(59,130,246,.16);color:var(--minor)}.b-info{background:rgba(154,161,173,.2);color:var(--muted)}
    .item .ttl{font-size:13px}.item .sub{font-size:11.5px;color:var(--muted)}
    .item .act{display:flex;gap:4px}.item .act button{padding:3px 8px;font-size:11.5px}
    .empty{color:var(--muted);text-align:center;padding:24px;font-size:13px}
    .st{font-weight:600}.st-active{color:var(--crit)}.st-acknowledged{color:var(--warn)}.st-resolved{color:var(--ok)}
    @media(max-width:880px){body{overflow:auto}#app{height:auto}.kpis{grid-template-columns:repeat(3,1fr)}.main{grid-template-columns:1fr}.viz{height:360px;flex:none}}
  </style>
</head>
<body>
  <div id="app">
    <header class="row">
      <div class="brand">AltoTech <span class="mut">AFDD</span> · Fault Console</div>
      <div class="spacer"></div>
      <span class="status" id="status"><span class="dot"></span> connecting…</span>
      <button id="refresh">↻ Refresh</button><button id="theme">☀️</button>
    </header>
    <div class="kpis" id="kpis"></div>
    <div class="main">
      <div class="card">
        <h3>Live building map <span class="spacer"></span><span class="status">rooms colored by worst active fault</span></h3>
        <div class="viz">
          <canvas id="scene"></canvas>
          <div class="hint">drag to orbit · scroll to zoom · right-drag to pan</div>
          <div class="viz-tools"><button id="resetView">Reset view</button></div>
          <div class="legend">
            <span><i style="background:#22c55e"></i>healthy</span><span><i style="background:#3b82f6"></i>minor</span>
            <span><i style="background:#f59e0b"></i>warning</span><span><i style="background:#ef4444"></i>critical</span>
          </div>
          <div id="tip"></div>
        </div>
      </div>
      <div class="right">
        <div class="card charts"><h3>Active faults by severity</h3>
          <div class="body"><div class="chartbox"><canvas id="sevChart"></canvas></div><div class="sevlist" id="sevlist"></div></div>
        </div>
        <div class="card log"><h3>Activity <span class="spacer"></span><span class="status" id="logcount"></span></h3>
          <div class="logbody" id="log"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const API=(location.origin&&!location.origin.startsWith("file"))?"":"http://localhost:8000";
    const SEV={critical:"#ef4444",warning:"#f59e0b",minor:"#3b82f6",info:"#9aa1ad"};
    const SEV3D={critical:0xef4444,warning:0xf59e0b,minor:0x3b82f6,info:0x9aa1ad,healthy:0x34d399};
    const $=id=>document.getElementById(id);
    const fmtAgo=s=>{if(!s)return"—";const d=Math.max(0,Math.floor(Date.now()/1000-s));return d<60?d+"s ago":d<3600?Math.floor(d/60)+"m ago":Math.floor(d/3600)+"h ago";};
    async function api(p){const r=await fetch(API+p);if(!r.ok)throw new Error(r.status);return r.json();}
    function setStatus(t,ok=true){$("status").innerHTML=`<span class="dot" style="background:${ok?'var(--ok)':'var(--crit)'}"></span> ${t}`;}

    let sevChart;
    function kpi(l,v,c){return `<div class="kpi"><div class="l">${l}</div><div class="v" style="color:${c||'var(--text)'}">${v}</div></div>`;}
    async function loadStatsAndSummary(){
      const [stats,sum]=await Promise.all([api("/api/v1/dashboard/stats"),api("/api/v1/dashboard/summary")]);
      $("kpis").innerHTML=[kpi("Active faults",sum.totals.active,sum.totals.active?"var(--crit)":"var(--ok)"),
        kpi("Devices",stats.devices),kpi("Healthy",stats.healthy_devices,"var(--ok)"),
        kpi("Faulted",stats.faulted_devices,stats.faulted_devices?"var(--warn)":"var(--muted)"),
        kpi("Ingest /s",stats.ingest_per_sec),kpi("Properties",stats.properties)].join("");
      const sevs=sum.by_severity,total=sevs.reduce((a,b)=>a+b.count,0)||1;
      $("sevlist").innerHTML=["critical","warning","minor","info"].map(s=>{const c=(sevs.find(x=>x.severity===s)||{}).count||0;
        return `<div class="sevrow"><span class="badge b-${s}">${s}</span><span class="bar"><i style="width:${Math.round(c/total*100)}%;background:${SEV[s]}"></i></span><span class="n">${c}</span></div>`;}).join("");
      const labels=sevs.map(x=>x.severity),data=sevs.map(x=>x.count),colors=labels.map(l=>SEV[l]||"#9aa1ad");
      const cfg={type:"doughnut",data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0}]},options:{plugins:{legend:{display:false}},cutout:"68%",responsive:true,maintainAspectRatio:false}};
      if(sevChart){sevChart.data=cfg.data;sevChart.update();}else sevChart=new Chart($("sevChart"),cfg);
    }
    async function loadLog(){
      const faults=await api("/api/v1/faults");$("logcount").textContent=`${faults.length} faults`;const box=$("log");
      if(!faults.length){box.innerHTML=`<div class="empty">No active faults — all systems nominal 🎉</div>`;return;}
      box.innerHTML=faults.slice(0,40).map(f=>`<div class="item"><span class="badge b-${f.severity}">${f.severity}</span>
        <div><div class="ttl">${f.rule||"Fault"} · <span class="st st-${f.status}">${f.status}</span></div>
        <div class="sub">${f.property_id||""} · ${f.location||""} · ${f.device_id||""} · ${fmtAgo(f.detected_at)}</div></div>
        <div class="act">${f.status!=="resolved"?`<button onclick="act('${f.id}','ack')">Ack</button><button onclick="act('${f.id}','resolve')">Resolve</button>`:""}</div></div>`).join("");
    }
    async function act(id,a){try{await fetch(API+`/api/v1/faults/${id}/${a}`,{method:"POST"});refresh();}catch(e){}}

    let renderer,scene,camera,controls,group,ground,grid,fog,raycaster,pointer,roomMeshes={},built=false;
    const CELL=1.5,FH=2.7,COLS=4,GAPB=2.6;
    function tcol(){const d=document.documentElement.dataset.theme!=="light";
      return d?{bg:0x0e1014,ground:0x12151c,grid:0x232a38,slab:0x222734,roof:0x2b3242,edge:0x3a4254}
              :{bg:0xeef1f5,ground:0xe6ebf1,grid:0xccd4df,slab:0xccd4df,roof:0xbcc6d2,edge:0x9aa6b4};}
    function initThree(){
      const cv=$("scene");
      renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
      renderer.setPixelRatio(Math.min(2,devicePixelRatio));
      renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
      scene=new THREE.Scene();const tc=tcol();fog=new THREE.Fog(tc.bg,30,90);scene.fog=fog;
      camera=new THREE.PerspectiveCamera(42,1,0.1,2000);camera.position.set(14,12,18);
      controls=new THREE.OrbitControls(camera,cv);
      controls.enableDamping=true;controls.dampingFactor=0.09;controls.maxPolarAngle=Math.PI*0.48;
      controls.minDistance=6;controls.maxDistance=80;controls.target.set(0,3,0);
      scene.add(new THREE.HemisphereLight(0xcdd6ff,0x141821,0.8));
      scene.add(new THREE.AmbientLight(0xffffff,0.18));
      const dl=new THREE.DirectionalLight(0xffffff,0.95);dl.position.set(12,22,10);dl.castShadow=true;
      dl.shadow.mapSize.set(2048,2048);const sc=dl.shadow.camera;sc.left=-30;sc.right=30;sc.top=30;sc.bottom=-30;sc.near=1;sc.far=90;
      scene.add(dl);
      ground=new THREE.Mesh(new THREE.PlaneGeometry(160,160),new THREE.MeshStandardMaterial({color:tc.ground,roughness:1,metalness:0}));
      ground.rotation.x=-Math.PI/2;ground.position.y=-0.02;ground.receiveShadow=true;scene.add(ground);
      grid=new THREE.GridHelper(80,80,tc.grid,tc.grid);grid.material.opacity=0.16;grid.material.transparent=true;scene.add(grid);
      group=new THREE.Group();scene.add(group);
      raycaster=new THREE.Raycaster();pointer=new THREE.Vector2();
      cv.addEventListener("pointermove",onHover);cv.addEventListener("pointerleave",()=>$("tip").style.display="none");
      window.addEventListener("resize",()=>{resize();});resize();animate();
    }
    function resize(){const v=$("scene").parentElement,w=v.clientWidth,h=v.clientHeight;if(!w||!h)return;
      renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
    function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}

    function makeLabel(text){const c=document.createElement("canvas"),x=c.getContext("2d");const fs=42;
      x.font=`600 ${fs}px -apple-system,Segoe UI,sans-serif`;const w=x.measureText(text).width;c.width=Math.ceil(w)+60;c.height=fs+36;
      x.font=`600 ${fs}px -apple-system,Segoe UI,sans-serif`;const r=22;x.fillStyle="rgba(13,16,22,.72)";
      x.beginPath();x.moveTo(r,0);x.arcTo(c.width,0,c.width,c.height,r);x.arcTo(c.width,c.height,0,c.height,r);x.arcTo(0,c.height,0,0,r);x.arcTo(0,0,c.width,0,r);x.closePath();x.fill();
      x.strokeStyle="rgba(255,255,255,.08)";x.lineWidth=2;x.stroke();
      x.fillStyle="#eef1f6";x.textBaseline="middle";x.fillText(text,30,c.height/2+2);
      const t=new THREE.CanvasTexture(c);t.anisotropy=4;
      const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false,depthWrite:false}));
      sp.scale.set(c.width/c.height*0.82,0.82,1);sp.renderOrder=10;return sp;}
    function colorFor(rm){return new THREE.Color(rm.active_faults>0?(SEV3D[rm.worst_severity]||SEV3D.warning):SEV3D.healthy);}
    function styleRoom(m,rm){const col=colorFor(rm),f=rm.active_faults>0;
      m.material.color=col;m.material.emissive=col;m.material.emissiveIntensity=f?0.85:0.16;
      m.material.opacity=f?0.92:0.78;m.material.roughness=0.14;m.material.metalness=0.0;}
    function buildBuildings(topo){
      while(group.children.length)group.remove(group.children[0]);roomMeshes={};
      const tc=tcol();
      const slabMat=new THREE.MeshStandardMaterial({color:tc.slab,roughness:.9,metalness:.05});
      const edgeMat=new THREE.LineBasicMaterial({color:tc.edge,transparent:true,opacity:.45});
      const fps=topo.properties.map(p=>{const rooms=p.rooms.filter(r=>r.type!=="electrical_zone");
        const fmap={};rooms.forEach(r=>(fmap[r.floor]=fmap[r.floor]||[]).push(r));
        const fks=Object.keys(fmap).map(Number).sort((a,b)=>a-b);
        const maxR=Math.max(1,...fks.map(k=>fmap[k].length));const cols=Math.min(COLS,maxR);
        const maxRows=Math.max(1,...fks.map(k=>Math.ceil(fmap[k].length/cols)));
        return{p,fmap,fks,cols,w:cols*CELL,d:maxRows*CELL};});
      const totalW=fps.reduce((a,f)=>a+f.w,0)+GAPB*(fps.length-1);
      let cur=-totalW/2;
      fps.forEach(f=>{const bx=cur+f.w/2;cur+=f.w+GAPB;
        const bg=new THREE.Group();bg.position.x=bx;group.add(bg);
        f.fks.forEach((fk,fi)=>{const rs=f.fmap[fk],rows=Math.ceil(rs.length/f.cols),gw=f.cols*CELL,gd=rows*CELL,y=fi*FH;
          const slab=new THREE.Mesh(new THREE.BoxGeometry(gw+0.7,0.16,gd+0.7),slabMat);slab.position.set(0,y,0);slab.receiveShadow=true;bg.add(slab);
          rs.forEach((room,ri)=>{const cx=((ri%f.cols)-(f.cols-1)/2)*CELL,cz=(Math.floor(ri/f.cols)-(rows-1)/2)*CELL,rh=FH*0.62;
            const geo=new THREE.BoxGeometry(CELL-0.28,rh,CELL-0.28);
            const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({roughness:.14,metalness:.0,transparent:true}));
            styleRoom(m,room);m.position.set(cx,y+0.08+rh/2,cz);m.castShadow=true;m.receiveShadow=true;m.userData={room,property:f.p};
            bg.add(m);roomMeshes[room.id]=m;
            const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo),edgeMat);e.position.copy(m.position);bg.add(e);});
        });
        const topY=f.fks.length*FH;
        const lbl=makeLabel(f.p.name);lbl.position.set(0,topY+1.3,0);bg.add(lbl);});
      built=true;fitView();
    }
    function updateColors(topo){topo.properties.forEach(p=>p.rooms.forEach(r=>{const m=roomMeshes[r.id];if(m)styleRoom(m,r);}));}
    function fitView(){
      const box=new THREE.Box3().setFromObject(group);if(box.isEmpty())return;
      const size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
      const fovr=camera.fov*Math.PI/180;
      const fitH=(size.y/2)/Math.tan(fovr/2);
      const fitW=(size.x/2)/Math.tan(fovr/2)/camera.aspect;
      let dist=Math.max(fitH,fitW,(size.z/2)/Math.tan(fovr/2))*1.12+2;
      controls.target.copy(center);
      const dir=new THREE.Vector3(0.5,0.45,1).normalize();
      camera.position.copy(center).add(dir.multiplyScalar(dist));
      camera.near=Math.max(0.1,dist/100);camera.far=dist*12;camera.updateProjectionMatrix();controls.update();
    }
    function onHover(ev){const rect=$("scene").getBoundingClientRect();
      pointer.x=((ev.clientX-rect.left)/rect.width)*2-1;pointer.y=-((ev.clientY-rect.top)/rect.height)*2+1;
      raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(Object.values(roomMeshes),false)[0];const tip=$("tip");
      if(hit){const {room,property}=hit.object.userData;
        const col=room.active_faults>0?SEV[room.worst_severity]||"#f59e0b":"#34d399";
        tip.innerHTML=`<div class="t">${property.name}</div><div class="s">${room.name} · floor ${room.floor} · ${room.devices} devices</div>
          <span class="pill" style="background:${col}22;color:${col}">${room.active_faults>0?(room.active_faults+" active fault"+(room.active_faults>1?"s":"")):"healthy"}</span>`;
        tip.style.display="block";const vw=$("scene").parentElement.getBoundingClientRect();
        let x=ev.clientX-vw.left+14,y=ev.clientY-vw.top+14;x=Math.min(x,vw.width-tip.offsetWidth-8);y=Math.min(y,vw.height-tip.offsetHeight-8);
        tip.style.left=x+"px";tip.style.top=y+"px";}else tip.style.display="none";}
    function refreshThemeScene(){const tc=tcol();if(fog)fog.color.setHex(tc.bg);if(ground)ground.material.color.setHex(tc.ground);if(grid)grid.material.color.setHex(tc.grid);
      built=false;if(window.__topo)buildBuildings(window.__topo);}

    async function refresh(){try{setStatus("live");
      const topo=await api("/api/v1/dashboard/topology");window.__topo=topo;
      if(!built)buildBuildings(topo);else updateColors(topo);
      await Promise.all([loadStatsAndSummary(),loadLog()]);
    }catch(e){setStatus("API unreachable",false);}}
    function toggleTheme(){const h=document.documentElement,n=h.dataset.theme==="dark"?"light":"dark";h.dataset.theme=n;
      $("theme").textContent=n==="dark"?"☀️":"🌙";try{localStorage.setItem("afdd-theme",n);}catch(e){}refreshThemeScene();}
    try{const t=localStorage.getItem("afdd-theme");if(t){document.documentElement.dataset.theme=t;$("theme").textContent=t==="dark"?"☀️":"🌙";}}catch(e){}
    $("theme").onclick=toggleTheme;$("refresh").onclick=refresh;$("resetView").onclick=fitView;
    initThree();refresh();setInterval(refresh,10000);
  </script>
</body>
</html>
