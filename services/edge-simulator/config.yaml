# Edge simulator configuration (fast demo preset).
push_interval_seconds: 15        # faster cadence for the demo
batch: true
seed: 42

# hotel_live is fed by the CSV replayer (real data), so the synthetic simulator skips it.
exclude_properties: [hotel_live]

# Shorter backfill so the stack is ready quickly but the engine still has history.
backfill:
  minutes: 30
  step_seconds: 60

# More/varied injected anomalies so the board and 3D heatmap look alive.
anomalies:
  - kind: temperature_spike
    device_suffix: "hotel_a-r101-temperature"
  - kind: temperature_spike
    device_suffix: "hotel_c-r301-temperature"
  - kind: flatline
    device_suffix: "hotel_a-r102-co2"
  - kind: flatline
    device_suffix: "hotel_b-r201-temperature"
  - kind: schedule_violation
    device_suffix: "hotel_b-r101-occupancy"
  - kind: energy_anomaly
    device_suffix: "hotel_c-f1-power1"
  - kind: energy_anomaly
    device_suffix: "hotel_b-f1-power1"
  - random_rate: 0.03
